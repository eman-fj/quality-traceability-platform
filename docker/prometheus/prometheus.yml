# QTP Prometheus scrape config.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Real StreamSets job metrics (records processed, error rate, run duration), via the
  # qtp-metrics exporter (qtp/metrics/exporter.py). A longer scrape interval than the
  # default 15s: each scrape makes live Control Hub API calls per job, so this avoids
  # hammering Control Hub every 15 seconds.
  - job_name: qtp-pipelines
    scrape_interval: 30s
    static_configs:
      - targets: ["qtp-metrics:9091"]

  # The SDC engine's own /metrics is registered with Control Hub via DPM (dpm.enabled=true
  # in its sdc.properties), so it redirects unauthenticated scrapes to a login page — there
  # is no local username/password to configure here. qtp-pipelines (above) reaches the same
  # real per-job metrics through the authenticated Control Hub API instead.
