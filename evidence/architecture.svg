<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .lbl{font-size:12px;font-weight:700;letter-spacing:.3px}
    .box{fill:#ffffff;stroke:#1F4E79;stroke-width:1.5;}
    .boxc{fill:#fff4f4;stroke:#c0392b;stroke-width:1.5;}
    .tb{font-size:11.5px;font-weight:700;fill:#1F4E79}
    .tbc{font-size:11.5px;font-weight:700;fill:#a93226}
    .t{font-size:10px;fill:#555}
    .title{font-size:18px;font-weight:700;fill:#1F4E79}
    .ln{fill:none;stroke:#5b6b7b;stroke-width:1.6;stroke-linejoin:round;marker-end:url(#g)}
    .clean{fill:none;stroke:#1F4E79;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#b)}
    .def{fill:none;stroke:#c0392b;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#r)}
    .fail{fill:none;stroke:#8a96a3;stroke-width:1.4;stroke-dasharray:5 4;stroke-linejoin:round;marker-end:url(#d)}
    .elabel{font-size:9.5px;font-weight:700;}
  </style>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5b6b7b"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#1F4E79"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#8a96a3"/></marker>
  </defs>

  <text x="20" y="34" class="title">Quality &amp; Traceability Platform (QTP) — Architecture</text>

  <!-- bands -->
  <rect x="16" y="56"  width="1268" height="112" rx="8" fill="#1F4E79" opacity="0.09"/>
  <rect x="16" y="176" width="1268" height="112" rx="8" fill="#2E8B57" opacity="0.09"/>
  <rect x="16" y="296" width="1268" height="112" rx="8" fill="#8e44ad" opacity="0.09"/>
  <rect x="16" y="416" width="1268" height="112" rx="8" fill="#c0392b" opacity="0.09"/>
  <rect x="16" y="536" width="1268" height="112" rx="8" fill="#d68910" opacity="0.10"/>
  <rect x="16" y="656" width="1268" height="112" rx="8" fill="#16a085" opacity="0.10"/>
  <text x="28" y="74"  class="lbl" fill="#1F4E79">1 · FACTORY EVENT BACKBONE</text>
  <text x="28" y="194" class="lbl" fill="#2E8B57">2 · STREAMSETS QUALITY INTELLIGENCE</text>
  <text x="28" y="314" class="lbl" fill="#8e44ad">3 · TRACEABILITY / SUPPLIER INTELLIGENCE</text>
  <text x="28" y="434" class="lbl" fill="#c0392b">4 · COMPLIANCE CONTROL TOWER</text>
  <text x="28" y="554" class="lbl" fill="#b9770e">5 · REPORTING &amp; EXECUTIVE OBSERVABILITY</text>
  <text x="28" y="674" class="lbl" fill="#138d75">6 · DEMO &amp; EVIDENCE</text>

  <!-- ============ EDGES (drawn first, under boxes) ============ -->
  <!-- 1 simulator->kafka -->
  <path class="ln" d="M233,112 H313"/>
  <!-- 2 kafka->ingest -->
  <path class="ln" d="M400,136 V160 H148 V206"/>
  <!-- 3 ingest->route -->
  <path class="ln" d="M233,232 H313"/>
  <!-- 4 route->conforming (clean) -->
  <path class="clean" d="M485,232 H565"/>
  <text x="500" y="225" class="elabel" fill="#1F4E79">clean</text>
  <!-- 5 route->defect (defect) -->
  <path class="def" d="M400,208 V196 H904 V206"/>
  <text x="690" y="190" class="elabel" fill="#c0392b">defect</text>
  <!-- 6 defect->DLQ -->
  <path class="fail" d="M989,232 H1069"/>
  <!-- 7 ingest->DLQ -->
  <path class="fail" d="M120,208 V184 H1156 V206"/>
  <text x="980" y="180" class="elabel" fill="#8a96a3">failures</text>
  <!-- 8 defect-> comb to ERP/classify/quarantine -->
  <path class="def" d="M904,256 V322 H148 V326"/>
  <path class="def" d="M400,322 V326"/>
  <path class="def" d="M652,322 V326"/>
  <!-- 9 conforming->Postgres (clean) -->
  <path class="clean" d="M565,232 H270 V472 H235"/>
  <!-- 10 conforming->MinIO (archive) -->
  <path class="clean" d="M737,234 H790 V592 H739"/>
  <text x="795" y="430" class="elabel" fill="#1F4E79">archive</text>
  <!-- 11 defect_enrichment->Postgres (enriched defect) -->
  <path class="def" d="M850,256 V272 H45 V472 H61"/>
  <!-- 12 Postgres->SLA -->
  <path class="ln" d="M233,472 H313"/>
  <!-- 13 SLA->alert (critical) -->
  <path class="def" d="M400,448 V436 H904 V446"/>
  <!-- 14 defect_rate->alert -->
  <path class="def" d="M737,472 H817"/>
  <!-- 15 Postgres->Grafana -->
  <path class="ln" d="M148,496 V566"/>
  <!-- 16 Postgres->shift -->
  <path class="ln" d="M180,496 V544 H400 V566"/>
  <!-- 17 shift->MinIO -->
  <path class="ln" d="M485,592 H565"/>
  <!-- 18 DLQ->MinIO -->
  <path class="fail" d="M1156,256 V592 H739"/>
  <!-- 19 demo->simulator (drives) -->
  <path class="fail" d="M180,688 H250 V112 H235"/>
  <text x="255" y="400" class="elabel" fill="#8a96a3">drives</text>
  <!-- 20 Postgres->evidence -->
  <path class="ln" d="M210,496 H292 V712 H298"/>

  <!-- ============ BOXES ============ -->
  <!-- L1 -->
  <rect class="box" x="63"  y="88"  width="170" height="48" rx="6"/><text x="148" y="108" text-anchor="middle" class="tb">inspection_simulator</text><text x="148" y="124" text-anchor="middle" class="t">3 lines · ~1 evt/s</text>
  <rect class="box" x="315" y="88"  width="170" height="48" rx="6"/><text x="400" y="108" text-anchor="middle" class="tb">Kafka topics</text><text x="400" y="124" text-anchor="middle" class="t">inspections / defects.*</text>
  <!-- L2 -->
  <rect class="box" x="63"  y="208" width="170" height="48" rx="6"/><text x="148" y="228" text-anchor="middle" class="tb">quality_ingest</text><text x="148" y="244" text-anchor="middle" class="t">enrich · tag · schema</text>
  <rect class="box" x="315" y="208" width="170" height="48" rx="6"/><text x="400" y="228" text-anchor="middle" class="tb">route</text><text x="400" y="244" text-anchor="middle" class="t">clean vs defect</text>
  <rect class="box" x="567" y="208" width="170" height="48" rx="6"/><text x="652" y="228" text-anchor="middle" class="tb">conforming_archive</text><text x="652" y="244" text-anchor="middle" class="t">clean path</text>
  <rect class="boxc" x="819" y="208" width="170" height="48" rx="6"/><text x="904" y="228" text-anchor="middle" class="tbc">defect_enrichment</text><text x="904" y="244" text-anchor="middle" class="t">defect path</text>
  <rect class="boxc" x="1071" y="208" width="170" height="48" rx="6"/><text x="1156" y="231" text-anchor="middle" class="tbc">DLQ handler</text><text x="1156" y="246" text-anchor="middle" class="t">MinIO error bucket</text>
  <!-- L3 -->
  <rect class="box" x="63"  y="328" width="170" height="48" rx="6"/><text x="148" y="348" text-anchor="middle" class="tb">MySQL ERP</text><text x="148" y="364" text-anchor="middle" class="t">batches · suppliers</text>
  <rect class="box" x="315" y="328" width="170" height="48" rx="6"/><text x="400" y="348" text-anchor="middle" class="tb">classify API</text><text x="400" y="364" text-anchor="middle" class="t">category · action</text>
  <rect class="box" x="567" y="328" width="170" height="48" rx="6"/><text x="652" y="348" text-anchor="middle" class="tb">quarantine API</text><text x="652" y="364" text-anchor="middle" class="t">retry ×3 → id</text>
  <!-- L4 -->
  <rect class="box" x="63"  y="448" width="170" height="48" rx="6"/><text x="148" y="468" text-anchor="middle" class="tb">Postgres · quality</text><text x="148" y="484" text-anchor="middle" class="t">parts · audit · q-log</text>
  <rect class="boxc" x="315" y="448" width="170" height="48" rx="6"/><text x="400" y="468" text-anchor="middle" class="tbc">SLA check</text><text x="400" y="484" text-anchor="middle" class="t">2-hour · breach-risk</text>
  <rect class="box" x="567" y="448" width="170" height="48" rx="6"/><text x="652" y="468" text-anchor="middle" class="tb">defect_rate_monitor</text><text x="652" y="484" text-anchor="middle" class="t">&gt;2% per line</text>
  <rect class="boxc" x="819" y="448" width="170" height="48" rx="6"/><text x="904" y="468" text-anchor="middle" class="tbc">alert dispatcher</text><text x="904" y="484" text-anchor="middle" class="t">INFO/WARN/CRITICAL</text>
  <!-- L5 -->
  <rect class="box" x="63"  y="568" width="170" height="48" rx="6"/><text x="148" y="588" text-anchor="middle" class="tb">Grafana centre</text><text x="148" y="604" text-anchor="middle" class="t">rate · top codes</text>
  <rect class="box" x="315" y="568" width="170" height="48" rx="6"/><text x="400" y="588" text-anchor="middle" class="tb">shift report</text><text x="400" y="604" text-anchor="middle" class="t">Excel · email</text>
  <rect class="box" x="567" y="568" width="170" height="48" rx="6"/><text x="652" y="588" text-anchor="middle" class="tb">MinIO</text><text x="652" y="604" text-anchor="middle" class="t">conforming/defects/dlq</text>
  <!-- L6 -->
  <rect class="box" x="63"  y="688" width="170" height="48" rx="6"/><text x="148" y="715" text-anchor="middle" class="tb">qtp demo run</text>
  <rect class="boxc" x="300" y="688" width="200" height="48" rx="6"/><text x="400" y="715" text-anchor="middle" class="tbc">qtp evidence pack</text>

  <!-- legend -->
  <g transform="translate(820,690)">
    <rect x="0" y="0" width="448" height="60" rx="6" fill="#ffffff" stroke="#d0d6dd"/>
    <line x1="14" y1="18" x2="46" y2="18" stroke="#5b6b7b" stroke-width="1.6"/><text x="54" y="22" class="t">normal flow</text>
    <line x1="150" y1="18" x2="182" y2="18" stroke="#1F4E79" stroke-width="1.8"/><text x="190" y="22" class="t">clean path</text>
    <line x1="290" y1="18" x2="322" y2="18" stroke="#c0392b" stroke-width="1.8"/><text x="330" y="22" class="t">defect / critical</text>
    <line x1="14" y1="42" x2="46" y2="42" stroke="#8a96a3" stroke-width="1.4" stroke-dasharray="5 4"/><text x="54" y="46" class="t">failures / control</text>
    <rect x="150" y="36" width="16" height="12" class="boxc" rx="2"/><text x="174" y="46" class="t">defect-critical component</text>
  </g>
</svg>
